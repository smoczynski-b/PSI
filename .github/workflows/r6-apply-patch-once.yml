name: Apply R6 cost semantics patch once

on:
  push:
    branches: [psi-memory-map-01]
    paths:
      - '.github/workflows/r6-apply-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded R6 patch
        run: python3 scripts/apply_r6_patch_once.py
      - name: Run R6 witness and affected regressions
        run: |
          python3 scripts/test_access_cost_semantics_r6.py
          python3 scripts/test_access_steward_runtime.py
          python3 scripts/test_result_reconciliation_r2.py
      - name: Commit bounded R6 implementation
        run: |
          git config user.name "Bartek Smoczynski"
          git config user.email "barteksmoczynski@tlen.pl"
          git add scripts/access_steward_runtime.py scripts/test_access_steward_runtime.py scripts/test_access_cost_semantics_r6.py
          git commit -m "Implement R6 cost evidence semantics"
          git push origin HEAD:psi-memory-map-01
