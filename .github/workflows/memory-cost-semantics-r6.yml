name: PSI memory R6 cost semantics

on:
  push:
    branches: [psi-memory-map-01]
    paths:
      - 'scripts/access_steward_runtime.py'
      - 'scripts/test_access_cost_semantics_r6.py'
      - 'scripts/test_access_steward_runtime.py'
      - '.github/workflows/memory-cost-semantics-r6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-semantics-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: R6 separating witness
        run: python3 scripts/test_access_cost_semantics_r6.py
      - name: F2.1 access steward regression
        run: python3 scripts/test_access_steward_runtime.py
      - name: R2 reconciliation regression
        run: python3 scripts/test_result_reconciliation_r2.py
