name: one-shot full-run harness correction

on:
  push:
    branches: [psi-memory-map-01]
    paths:
      - '.github/workflows/tmp-fix-full-bounded-harness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psi-memory-map-01
          fetch-depth: 0
      - name: Isolate mutable workspace seeds across restart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_psi_memory_full_bounded_run.py')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('import csv\n', 'import copy\nimport csv\n', 1)
          s = s.replace(
              '        shared.register(SOURCE_VIEW, source)\n',
              '        shared.register(SOURCE_VIEW, copy.deepcopy(source))\n',
              1,
          )
          s = s.replace(
              '        shared.register(RESULT_VIEW, result, extra_dependencies=(f"workspace:{SOURCE_VIEW}",))\n',
              '        shared.register(RESULT_VIEW, copy.deepcopy(result), extra_dependencies=(f"workspace:{SOURCE_VIEW}",))\n',
              1,
          )
          if s == old:
              raise SystemExit('expected seed-isolation patch did not apply')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit correction
        run: |
          git config user.name 'psi-agent'
          git config user.email 'psi-agent@users.noreply.github.com'
          git add scripts/test_psi_memory_full_bounded_run.py
          git commit -m 'Isolate full-run workspace seeds across restart'
          git push origin HEAD:psi-memory-map-01
