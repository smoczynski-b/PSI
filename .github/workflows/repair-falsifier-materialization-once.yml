name: PSI one-shot falsifier materialization repair

on:
  push:
    branches: [psi-memory-map-01]
    paths:
      - '.github/workflows/repair-falsifier-materialization-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psi-memory-map-01
          fetch-depth: 0
      - name: Materialize F63-F64 and add drift regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base_path = Path('docs/falsifier-registry.md')
          ext_path = Path('docs/falsifier-registry-13.md')
          base = base_path.read_text(encoding='utf-8')
          ext = ext_path.read_text(encoding='utf-8')

          if '## F63 —' not in base:
              tail = '## F63 —' + ext.split('## F63 —', 1)[1]
              base = base.replace(
                  '**Materialized:** 2026-09-29 from falsifier-registry-01 through 12.',
                  '**Materialized:** 2026-10-01 from falsifier-registry-01 through 13.'
              )
              base = base.replace('All 62 entries are present below;', 'All 64 entries are present below;')
              base = base.rstrip() + '\n\n---\n\n' + tail.lstrip()
              base_path.write_text(base, encoding='utf-8')

          state_path = Path('docs/control-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['registry_counts']['F'] = 64
          state.setdefault('supersedes', {})['docs/falsifier-registry.md'] = ['docs/falsifier-registry-13.md']
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          check_path = Path('scripts/check_control.py')
          check = check_path.read_text(encoding='utf-8')
          marker = "    task_ids = [t['id'] for t in state['tasks']]\n"
          guard = '''    # Stable materialized registries must include the latest numbered snapshot.\n    for role, stem in [('claim-registry', 'claim-registry'), ('falsifier-registry', 'falsifier-registry')]:\n        versions = []\n        for p in (root / 'docs').glob(stem + '-*.md'):\n            m = re.fullmatch(re.escape(stem) + r'-(\\d+)\\.md', p.name)\n            if m:\n                versions.append((int(m.group(1)), str(p.relative_to(root))))\n        if versions:\n            latest_path = max(versions)[1]\n            require(latest_path in state.get('supersedes', {}).get(current[role], []),\n                    f'{role} latest version not materialized: {latest_path}')\n\n'''
          if 'latest version not materialized' not in check:
              if marker not in check:
                  raise SystemExit('check_control insertion marker missing')
              check = check.replace(marker, guard + marker, 1)
              check_path.write_text(check, encoding='utf-8')

          test_path = Path('scripts/test_control.py')
          test = test_path.read_text(encoding='utf-8')
          test_marker = "    def test_recursive_registry(self):\n"
          new_test = '''    def test_latest_falsifier_snapshot_must_be_materialized(self):\n        (self.root / 'docs/falsifier-registry-99.md').write_text(\n            '# PSI — future falsifier snapshot\\n\\n## F99 — synthetic\\n', encoding='utf-8')\n        self.detects('falsifier-registry latest version not materialized')\n\n'''
          if 'test_latest_falsifier_snapshot_must_be_materialized' not in test:
              if test_marker not in test:
                  raise SystemExit('test_control insertion marker missing')
              test = test.replace(test_marker, new_test + test_marker, 1)
              test_path.write_text(test, encoding='utf-8')
          PY
      - name: Run control regressions before commit
        run: |
          python scripts/test_control.py
          python scripts/check_control.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/falsifier-registry.md docs/control-state.json scripts/check_control.py scripts/test_control.py
          git commit -m 'Materialize F63-F64 in stable falsifier registry'
          git push origin HEAD:psi-memory-map-01
