name: PSI memory map experiment

on:
  push:
    branches: [psi-memory-map-01]
    paths:
      - 'docs/memory/**'
      - 'experiments/PSI-MEMORY-M4-01.md'
      - 'experiments/PSI-MEMORY-M6-REL-01.md'
      - 'experiments/PSI-MEMORY-M7-EDGE-CERT-01.md'
      - 'experiments/m4-*-manifest.txt'
      - 'experiments/m5-generated-manifest.txt'
      - 'scripts/test_memory_map.py'
      - 'scripts/test_memory_economy.py'
      - 'scripts/build_memory_pack.py'
      - 'scripts/test_memory_pack.py'
      - 'scripts/test_relation_description.py'
      - 'scripts/build_edge_provenance.py'
      - 'scripts/test_edge_provenance.py'
      - '.github/workflows/memory-map-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run M1-M3 dependency and bridge regressions
        run: python3 scripts/test_memory_map.py
      - name: Run M4a context economy measurement
        run: python3 scripts/test_memory_economy.py
      - name: Verify M5 generated pack snapshot
        run: python3 scripts/build_memory_pack.py --start GO-G4 --radius 3 --check experiments/m5-generated-manifest.txt
      - name: Run M5 automatic pack regression
        run: python3 scripts/test_memory_pack.py
      - name: Run M6 relational-description regression
        run: python3 scripts/test_relation_description.py
      - name: Emit M7 certified edge-evidence hashes
        run: python3 scripts/build_edge_provenance.py --emit
      - name: Run M7 certified-edge regression
        run: python3 scripts/test_edge_provenance.py
